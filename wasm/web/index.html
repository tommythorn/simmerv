<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <!-- Without this, mobile Safari lays the page out at 980px and scales the
         result down to the screen, so an 80-column terminal arrives at about a
         third of the size it should be. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linux on Simmerv</title>
    <link rel="stylesheet" href="xtermjs/xterm.css" />
    <script src="xtermjs/xterm.js"></script>
    <style>
      /* Phones give the terminal the whole width: at 80 columns every pixel
         spent on a margin is taken out of the font size. Wider screens keep
         the inset, where there is width to spare. */
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        /* Stop iOS from inflating text on its own -- the font size here is
           chosen to make exactly 80 columns fit. */
        -webkit-text-size-adjust: 100%;
      }
      #footer { margin: 0.75rem 0.5rem 1rem; font-size: 0.9rem; }
      @media (min-width: 900px) {
        body { margin: 1rem; }
        #footer { margin: 0.75rem 0 0; }
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <div id="footer">
      <a href="https://github.com/tommythorn/simmerv" target="_blank">Simmerv</a>,
      RISC-V RVA22S64 &mdash; files are fetched on demand so cold starts are slow
      at first.
      <span id="rate"></span>
    </div>

    <script type="module">
      import App from './App.js';
      import init, { WasmRiscv } from "./simmerv_wasm.js";

      // Everything the demo boots, in one place. The Pages site root is this
      // directory and .github/workflows/pages.yml stages linux/ beside it.
      //
      // The root filesystem is a read-only squashfs, so the initramfs mounts a
      // tmpfs over it before handing off to systemd; the device tree is what
      // tells the kernel where that initramfs was placed, which is why the
      // address below has to match linux/demo/build.sh.
      const KERNEL  = './linux/fw_payload.bin';
      const DTB     = './linux/demo/demo.dtb';
      const INITRD  = './linux/demo/initramfs.cpio';
      // A squashfs despite the extension: GitHub Pages gzips anything it
      // types application/octet-stream (.sqfs, .img, .iso, .bin all are), and
      // that compression applies to range responses too -- so the bytes would
      // arrive as slices of a gzip stream. .cpio is typed application/x-cpio
      // and served untouched. See the note in .github/workflows/pages.yml.
      const ROOTFS  = './linux/demo/rootfs.cpio';
      const INITRD_ADDR = 0x9e000000;

      // The root filesystem is streamed: rather than downloading it, we hand
      // the emulator its size and serve 64 KiB blocks as the guest asks for
      // them. A boot touches a small fraction of the image, so this starts
      // sooner and transfers far less than fetching the whole thing.
      // Must match the block size the squashfs was built with -- see
      // linux/demo/mkdemo-image.sh.
      const BLOCK = 65536;

      const COLUMNS = 80;
      // Exact, not a minimum: the terminal is always resized to this. Once the
      // font shrinks to fit 80 columns on a phone the rows get short too, so
      // there is room for well more than the traditional 24.
      const ROWS = 37;

      const container = document.getElementById('terminal');
      const terminal = new Terminal();
      terminal.setOption('cursorBlink', true);
      terminal.setOption('convertEol', true);
      terminal.open(container);

      // The vendored build is xterm 4, whose API is setOption/getOption;
      // xterm 5 replaced those with a plain options object. Prefer the
      // accessors, because in 4 an `options` object also exists but assigning
      // to it does not re-measure the character cell.
      const getOpt = name =>
        typeof terminal.getOption === 'function'
          ? terminal.getOption(name)
          : terminal.options[name];
      const setFontSize = size => {
        if (typeof terminal.setOption === 'function') terminal.setOption('fontSize', size);
        else terminal.options.fontSize = size;
      };
      const DEFAULT_FONT_SIZE = getOpt('fontSize') || 15;

      // Width of one cell at a 1px font, measured the way xterm measures it:
      // 32 'W's laid out in the DOM, divided by 32. Computing it instead would
      // mean guessing which monospace font the device actually resolved.
      const cellWidthPerPx = () => {
        const probe = document.createElement('span');
        probe.style.cssText =
          'position:absolute;top:-9999px;visibility:hidden;white-space:pre;'
          + `font-family:${getOpt('fontFamily') || 'monospace'};font-size:100px;`;
        probe.textContent = 'W'.repeat(32);
        document.body.appendChild(probe);
        const width = probe.getBoundingClientRect().width / 32 / 100;
        probe.remove();
        return width;
      };

      // xterm relays out asynchronously, so confirm against the real element
      // and nudge down if it still overflows. xterm floors the cell width to
      // whole device pixels, which can only make cells narrower than the
      // estimate, so this is a backstop rather than the mechanism.
      const settle = tries => requestAnimationFrame(() => {
        const avail = container.clientWidth;
        const width = terminal.element.getBoundingClientRect().width;
        if (width <= avail || tries <= 0) return;
        const scaled = Math.floor(getOpt('fontSize') * (avail / width) * 10) / 10;
        const next = scaled < getOpt('fontSize') ? scaled : getOpt('fontSize') - 0.1;
        if (next < 4) return;
        setFontSize(next);
        settle(tries - 1);
      });

      // Scale the font so that exactly COLUMNS columns span the available
      // width. On a phone the alternative is a line the guest wrote as 80
      // characters arriving clipped or horizontally scrolling, which is what
      // makes it unreadable. Never grows past the default, so anything wide
      // enough already -- every desktop -- is left exactly as it was.
      // iOS fires `resize` every time the URL bar hides or shows, which does
      // not change the width; refitting on those would re-measure and repaint
      // the terminal on every scroll.
      let fittedFor = -1;
      const fit = () => {
        const avail = container.clientWidth;
        if (!avail || avail === fittedFor) return;
        fittedFor = avail;
        const unit = cellWidthPerPx();
        if (!unit) return;
        const size = Math.min(
          DEFAULT_FONT_SIZE,
          Math.floor((avail / COLUMNS / unit) * 10) / 10,
        );
        setFontSize(Math.max(size, 4));
        terminal.resize(COLUMNS, ROWS);
        settle(4);
      };

      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();

      // The rootfs is tens of megabytes; silence while it arrives looks like a
      // hung page, so report progress on a single line that is then erased.
      const fetchWithProgress = async (url, label) => {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`${url}: ${response.status} ${response.statusText}`);
        }
        const total = Number(response.headers.get('content-length')) || 0;
        const reader = response.body.getReader();
        const chunks = [];
        let got = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          got += value.length;
          const mb = (got / 1048576).toFixed(1);
          const pct = total ? ` (${Math.round((got / total) * 100)}%)` : '';
          terminal.write(`\r  ${label}: ${mb} MB${pct}`);
        }
        const buf = new Uint8Array(got);
        let at = 0;
        for (const c of chunks) {
          buf.set(c, at);
          at += c.length;
        }
        return buf;
      };

      // Feeds the streaming disk. The emulator never waits on the network: a
      // read of a block that has not arrived is deferred and retried, so all
      // this has to do is notice what is wanted and go and get it.
      //
      // A fetch that fails is simply not provided -- the guest retries the
      // read, the device asks for the block again, and we try once more. The
      // in-flight set is what stops that retry from piling up duplicate
      // requests for a block already on its way.
      const startBlockPump = (riscv, url, total) => {
        const inFlight = new Set();
        const pump = () => {
          for (const b of riscv.take_wanted_blocks()) {
            if (inFlight.has(b)) continue;
            inFlight.add(b);
            const lo = b * BLOCK;
            const hi = Math.min(lo + BLOCK - 1, total - 1);
            fetch(url, { headers: { Range: `bytes=${lo}-${hi}` } })
              .then(r => {
                if (r.status !== 206) {
                  throw new Error(`expected 206 Partial Content, got ${r.status}`);
                }
                // If the server ever encodes the response, the range covers
                // the *encoded* stream and these are not disk bytes at all.
                // That failed silently once: the guest mounted garbage and
                // reported a corrupt filesystem, with nothing to point at the
                // transport. Check it, and say so.
                const enc = r.headers.get('content-encoding');
                if (enc) {
                  throw new Error(`server encoded the range as '${enc}'; `
                    + 'ranges no longer address the raw image');
                }
                return r.arrayBuffer();
              })
              .then(a => riscv.provide_block(b, new Uint8Array(a)))
              .catch(err => terminal.writeln(`\r\n[disk] block ${b}: ${err.message}`))
              .finally(() => inFlight.delete(b));
          }
          setTimeout(pump, 0);
        };
        pump();
      };

      // Emulated MIPS, once a second. Two performance.now() calls and one
      // wasm call per second is nothing, and without it "the browser feels
      // slow" is not a number anyone can act on -- native throughput is
      // measurable, so this makes the two comparable.
      const startRateMeter = riscv => {
        const rate = document.getElementById('rate');
        let lastInstrs = riscv.instructions_retired();
        let lastAt = performance.now();
        setInterval(() => {
          const instrs = riscv.instructions_retired();
          const at = performance.now();
          const mips = (instrs - lastInstrs) / (at - lastAt) / 1000;
          rate.textContent = ` — ${mips.toFixed(1)} MIPS`;
          lastInstrs = instrs;
          lastAt = at;
        }, 1000);
      };

      const boot = async () => {
        const kernel = await fetchWithProgress(KERNEL, 'kernel');
        const [dtb, initrd, head] = await Promise.all([
          fetch(DTB).then(r => r.arrayBuffer()).then(b => new Uint8Array(b)),
          fetch(INITRD).then(r => r.arrayBuffer()).then(b => new Uint8Array(b)),
          fetch(ROOTFS, { method: 'HEAD' }),
        ]);
        terminal.write('\r\x1b[2K');

        // The guest needs a disk capacity at probe time, long before any block
        // has been fetched, so the size has to come from the server up front.
        const total = Number(head.headers.get('content-length'));
        if (!total) {
          throw new Error(`${ROOTFS}: no content-length, cannot size the disk`);
        }
        if (head.headers.get('accept-ranges') !== 'bytes') {
          terminal.writeln('[disk] server does not advertise range requests');
        }

        const riscv = WasmRiscv.new();
        riscv.load_image(kernel);
        riscv.setup_dtb(dtb);
        riscv.load_blob_at(initrd, INITRD_ADDR);
        riscv.setup_streamed_filesystem(total, BLOCK);
        startBlockPump(riscv, ROOTFS, total);
        startRateMeter(riscv);
        new App(riscv, terminal, { debugModeEnabled: false }).run();
      };

      init()
        .then(boot)
        .catch(error => terminal.writeln(`\r\n${error.message}`));
    </script>
  </body>
</html>
