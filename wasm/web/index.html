<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <title>Linux on Simmerv</title>
    <link rel="stylesheet" href="xtermjs/xterm.css" />
    <script src="xtermjs/xterm.js"></script>
    <style>
      body { margin: 1rem; font-family: system-ui, sans-serif; }
      #footer { margin-top: 0.75rem; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <div id="footer">
      Linux on a <a href="https://github.com/tommythorn/simmerv" target="_blank">RISC-V
      emulator written in Rust</a>, compiled to WebAssembly and running in this tab.
    </div>

    <script type="module">
      import App from './App.js';
      import init, { WasmRiscv } from "./simmerv_wasm.js";

      // Everything the demo boots, in one place. The Pages site root is this
      // directory and .github/workflows/pages.yml stages linux/ beside it.
      const KERNEL = './linux/fw_payload.elf';
      const ROOTFS = './linux/rootfs.img';

      const COLUMNS = 80;
      const MINIMUM_ROWS = 24;

      const terminal = new Terminal();
      terminal.setOption('cursorBlink', true);
      terminal.setOption('convertEol', true);
      terminal.open(document.getElementById('terminal'));

      // From https://github.com/xtermjs/xterm.js/tree/master/addons/xterm-addon-fit
      const onResize = () => terminal.resize(COLUMNS, MINIMUM_ROWS);
      window.addEventListener('resize', onResize);
      onResize();

      // The rootfs is tens of megabytes; silence while it arrives looks like a
      // hung page, so report progress on a single line that is then erased.
      const fetchWithProgress = async (url, label) => {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`${url}: ${response.status} ${response.statusText}`);
        }
        const total = Number(response.headers.get('content-length')) || 0;
        const reader = response.body.getReader();
        const chunks = [];
        let got = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          got += value.length;
          const mb = (got / 1048576).toFixed(1);
          const pct = total ? ` (${Math.round((got / total) * 100)}%)` : '';
          terminal.write(`\r  ${label}: ${mb} MB${pct}`);
        }
        const buf = new Uint8Array(got);
        let at = 0;
        for (const c of chunks) {
          buf.set(c, at);
          at += c.length;
        }
        return buf;
      };

      const boot = async () => {
        const kernel = await fetchWithProgress(KERNEL, 'kernel');
        const rootfs = await fetchWithProgress(ROOTFS, 'root filesystem');
        terminal.write('\r\x1b[2K');

        const riscv = WasmRiscv.new();
        riscv.load_image(kernel);
        riscv.setup_filesystem(rootfs);
        new App(riscv, terminal, { debugModeEnabled: false }).run();
      };

      init()
        .then(boot)
        .catch(error => terminal.writeln(`\r\n${error.message}`));
    </script>
  </body>
</html>
