name: Wasm demo

# Builds the browser demo and, on main, publishes wasm/web as the GitHub Pages
# site. The generated simmerv_wasm.js / simmerv_wasm_bg.wasm used to be checked
# in and served straight off the main branch, which meant the live demo only
# refreshed when someone remembered to run build.sh and commit -- it had drifted
# 28 commits behind. Building here keeps it in step with main automatically.
#
# Requires the repository's Pages source to be "GitHub Actions" (build_type
# "workflow"); with the older branch-served setting this deploy step fails.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The demo's root filesystem is 208 MB, past GitHub's 100 MB file limit, so
  # it is a release asset rather than a tracked file. Rebuild it with
  # linux/demo/mkdemo-image.sh and re-upload to this tag.
  ROOTFS_TAG: demo-image
  ROOTFS_URL: https://github.com/tommythorn/simmerv/releases/download/demo-image/rootfs.sqfs

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      # `cargo install wasm-pack` takes minutes; build.sh skips it when the
      # binary is already there, so caching makes it a no-op. wasm-pack fetches
      # its own matching wasm-bindgen and wasm-opt into ~/.cache/.wasm-pack.
      - name: Cache wasm toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cache/.wasm-pack
          key: wasm-tools-${{ runner.os }}-${{ hashFiles('wasm/build.sh') }}

      - name: Build
        run: cd wasm && ./build.sh

      # Fetched rather than checked out, and staged into the site rather than
      # linked to directly: release assets carry no Access-Control-Allow-Origin,
      # so the browser cannot range-request one cross-origin from the Pages
      # site. Served same-origin from here, it can.
      - name: Cache the demo root filesystem
        id: rootfs
        uses: actions/cache@v4
        with:
          path: rootfs.sqfs
          key: demo-rootfs-${{ env.ROOTFS_TAG }}

      - name: Download the demo root filesystem
        if: steps.rootfs.outputs.cache-hit != 'true'
        run: curl -fsSL -o rootfs.sqfs "$ROOTFS_URL"

      # The demo fetches its kernel and rootfs at run time (see resourcePath in
      # index.html). They used to come from the checked-in tree because Pages
      # served the whole repository; now the site is just this directory, so
      # stage them next to it. ~83 MB, well inside the 1 GB Pages limit.
      - name: Assemble site
        run: |
          mkdir -p _site/linux/demo
          cp -r wasm/web/. _site/
          cp linux/fw_payload.bin _site/linux/
          cp linux/demo/demo.dtb linux/demo/initramfs.cpio _site/linux/demo/
          # The tracked linux/demo/rootfs.sqfs is the small image, kept for CLI
          # use; the demo serves the full one from the release asset.
          #
          # Deliberately named .cpio, which it is not. Pages picks a MIME type
          # from the extension and gzips anything typed application/octet-stream
          # -- which .sqfs, .img, .iso, .bin and .raw all are. Compression
          # applies to range responses too, so the browser would receive slices
          # of a gzip stream and feed them to squashfs as if they were disk
          # blocks. Measured: .cpio is served application/x-cpio and left
          # alone. index.html checks the response headers and fails loudly if
          # that ever stops being true.
          cp rootfs.sqfs _site/linux/demo/rootfs.cpio
          du -sh _site

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Pull requests build only: deploying from a PR would publish unreviewed
  # code, and forks do not get the write permissions anyway.
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
