[package]
name = "simmerv"
version = "0.3.0"
edition = "2024"
description = "RISC-V emulator written in Rust"
authors = ["Takahiro <hogehoge@gachapin.jp>", "Tommy Thorn <tommy-github2@thorn.ws>"]
license = "MIT"
repository = "https://github.com/tommythorn/simmerv"
exclude = [
  "linux/*",
  "screenshots/*",
  "wasm/*"
]

[workspace]
resolver = "3"
members = [".", "sim", "gendecoder", "wasm", "cosim"]
default-members = ["sim"]

[lints.clippy]
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
unreadable_literal = "allow"

[features]
paranoid-tlb = []
# Records the distribution of *executed* uop-cache block lengths (see
# `BbCache::dyn_len`).  Off by default: the counter is a bump in the
# block-executor hot loop and costs ~1.8% on an Ubuntu boot (220.8 vs 224.9
# Mc/s, interleaved).  It is a diagnostic, not a statistic worth that.
bb-hist = []
# Records the uop-cache *reference stream* -- one `(key, len)` per block
# execution -- into a file, so cache organisations can be swept offline instead
# of at one emulator run per point.  Off by default and inert unless
# `SIMMERV_TRACE` names an output path; see `src/uop_trace.rs`.  Armed by a
# cycle window, because the full Geekbench suite is ~44 G references and only
# the ~1 G of Clang are interesting.  The stream also carries workload-boundary
# marks (`Cpu::trace_mark`), so one whole-suite capture can be replayed into a
# per-subtest table instead of a single aggregate in which Clang is 93% of the
# misses and 1.4% of the cycles.
bb-trace = []

[badges]
travis-ci = { repository = "tommythorn/simmerv" }

[dependencies]
brotli = { version = "7", default-features = false, features = ["std"] }
fnv = "1.0.7"
num-traits = "*"
num-derive = "*"
wasm-timer = "0.2.5"
log = "0.4.26"
xmas-elf = "0.10.0"
anyhow = "1.0.98"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"
# Blocking HTTP client for URL-backed disks (range requests). rustls TLS only;
# gzip/json/etc. disabled so binary range responses pass through untouched.
ureq = { version = "2", default-features = false, features = ["tls"] }

[build-dependencies]
cc = "1"

[profile.release]
debug = true

[dev-dependencies.cargo-husky]
version = "1"
default-features = false # Disable features which are enabled by default
# user-hooks installs .cargo-husky/hooks/* verbatim. The canned
# run-cargo-* features hardcode a bare `cargo test`, which skips tests/.
features = ["user-hooks"]
